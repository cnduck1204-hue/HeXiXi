services:
  dev:
    image: rcore-tutorial-v3:latest
    platform: linux/amd64
    build:
      context: .
      target: build
    working_dir: /hexixi
    entrypoint: ["bash", "-lc"]
    command: ["make run"]
    stdin_open: true
    tty: true
    volumes:
      - .:/hexixi
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git

volumes:
  cargo-registry:
    name: hexixi-cargo-registry
  cargo-git:
    name: hexixi-cargo-git
